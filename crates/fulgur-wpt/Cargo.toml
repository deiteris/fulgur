[package]
name = "fulgur-wpt"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "W3C web-platform-tests runner for fulgur (dev-only, not published)"

[features]
## Render through the unpublished Raikiri backend when
## `FULGUR_WPT_ENGINE=raikiri` is set. Off by default so the Blitz WPT jobs
## and the workspace CI never compile Raikiri.
raikiri = ["dep:fulgur-raikiri", "dep:fontique"]

[dependencies]
fulgur = { path = "../fulgur" }
fulgur-raikiri = { path = "../fulgur-raikiri", optional = true }
fulgur-vrt = { path = "../fulgur-vrt" }
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
log = "0.4"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# Same pin as fulgur-dev: Blitz enables dynamic loading in the shared
# fontconfig-sys dependency, so Raikiri's newer font stack must select the
# matching API when both backends link.
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen"], optional = true }

[dev-dependencies]
tempfile = "3"
